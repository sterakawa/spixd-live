<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIXD LIVE</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f3}
*{box-sizing:border-box} body{margin:0} main{max-width:1050px;margin:auto;padding:32px 20px 60px}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
h1{margin:0;font-size:32px;letter-spacing:.04em} .sub{color:#777;margin-top:5px}
.file{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}.source{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.source input{padding:9px 10px;border:1px solid #ccc;border-radius:8px}.source button{padding:9px 12px;border:1px solid #222;border-radius:8px;background:#222;color:#fff;cursor:pointer}.source small{width:100%;color:#777}
.status{margin:18px 0;padding:18px 20px;background:#fff;border-radius:14px;border:1px solid #ddd}
.status strong{font-size:22px}.status small{display:block;color:#777;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}
.label{font-size:13px;color:#777}.value{font-size:32px;font-weight:700;margin-top:6px}.unit{font-size:13px;font-weight:400;color:#777}
.wide{grid-column:span 2}.chartWrap{display:grid;grid-template-columns:32px 1fr;gap:8px;margin-top:12px}.yaxis{height:180px;position:relative;color:#888;font-size:11px}.ytick{position:absolute;right:0;transform:translateY(50%)}.chart{height:180px;display:flex;align-items:end;gap:4px;border-bottom:1px solid #bbb;padding-top:15px;position:relative;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#e8e8e5 25%)}
.bar{flex:1;min-width:5px;background:#222;border-radius:3px 3px 0 0;position:relative}.bar:hover:after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#111;color:#fff;font-size:11px;padding:4px 6px;border-radius:4px}
.empty{color:#888;padding:50px 0;text-align:center}
@media(max-width:720px){
 main{padding:20px 14px 36px}
 header{display:block;margin-bottom:18px}
 h1{font-size:28px}.sub{font-size:14px}
 .file{margin-top:14px;padding:10px}
 .source{display:grid;grid-template-columns:1fr auto;gap:8px}
 .source input{width:100%;min-width:0;font-size:16px}
 .source button{white-space:nowrap;min-height:44px;font-size:14px}
 .source small{grid-column:1/-1;line-height:1.45}
 .status{margin:14px 0;padding:15px 16px}.status strong{font-size:20px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .card{padding:14px 12px;border-radius:12px;min-width:0}
 .label{font-size:12px}.value{font-size:27px;white-space:nowrap}.unit{font-size:11px}
 .wide{grid-column:span 2}
 .chartWrap{grid-template-columns:25px minmax(0,1fr);gap:6px;overflow:hidden}
 .chart,.yaxis{height:150px}
 .chart{gap:2px;overflow:hidden}.bar{min-width:2px}
 #meta{font-size:13px;line-height:1.55;overflow-wrap:anywhere}
 .empty{padding:36px 0;font-size:14px}
}
@media(max-width:390px){
 main{padding-left:10px;padding-right:10px}
 .card{padding:12px 10px}
 .value{font-size:24px}
 .source{grid-template-columns:1fr}
 .source button,.source small{grid-column:1}
}
</style>
</head>
<body><main>
<header><div><h1>SPIXD LIVE</h1><div class="sub">撮影ログから、人の流れを見る。</div><div id="liveDate" style="font-size:14px;font-weight:700;margin-top:8px"></div></div>
<div><label class="file">ENTRY LISTを選択 <input id="file" type="file" accept=".html,.htm,text/html,.xml,text/xml"></label>
<div class="source" style="margin-top:10px"><input id="groupId" value="aathletics2026" placeholder="グループID"><button id="loadSpixd" type="button">SPIXDから読み込む</button><small id="connection">接続テスト用：SPIXD AI用ENTRY LISTから取得を試します。</small></div></div></header>
<div id="empty" class="empty">保存した ENTRY LIST.html を選択してください。</div>
<section id="dash" hidden>
<div class="status"><strong id="statusText">—</strong><small id="statusDetail"></small></div>
<div class="grid">
<div class="card"><div class="label">本日の撮影数</div><div class="value" id="total">—</div></div>
<div class="card"><div class="label">現在ペース</div><div class="value"><span id="currentPace">—</span><span class="unit"> 組/時</span></div></div>
<div class="card"><div class="label">本日平均</div><div class="value"><span id="dayPace">—</span><span class="unit"> 組/時</span></div></div>
<div class="card"><div class="label">本日ピーク</div><div class="value"><span id="peakPace">—</span><span class="unit"> 組/時</span></div></div>
<div class="card"><div class="label">直近5分</div><div class="value"><span id="m5">—</span><span class="unit"> 組</span></div></div>
<div class="card"><div class="label">直近10分</div><div class="value"><span id="m10">—</span><span class="unit"> 組</span></div></div>
<div class="card"><div class="label">直近30分</div><div class="value"><span id="m30">—</span><span class="unit"> 組</span></div></div>
<div class="card"><div class="label">30分平均</div><div class="value"><span id="pace">—</span><span class="unit"> 組/時</span></div></div>
<div class="card"><div class="label">高負荷継続</div><div class="value"><span id="highDuration">—</span><span class="unit"> 分</span></div></div>
<div class="card"><div class="label">平均撮影間隔</div><div class="value"><span id="interval">—</span><span class="unit"> 秒</span></div></div>
<div class="card wide"><div class="label">撮影時間</div><div class="value" style="font-size:22px"><span id="first">—</span> → <span id="last">—</span></div></div>
<div class="card wide"><div class="label">5分ごとの撮影数（組）</div><div class="chartWrap"><div id="yaxis" class="yaxis"></div><div id="chart" class="chart"></div></div></div>
<div class="card wide"><div class="label">解析対象</div><div id="meta" style="margin-top:10px;line-height:1.7"></div></div>
</div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function toShot(date,time,name){
 if(!/^\d{2}\.\d{2}\.\d{2}$/.test(date)||!/^\d{2}:\d{2}:\d{2}$/.test(time)||/^TEST$/i.test(name))return null;
 const [yy,mo,da]=date.split(".").map(Number),[h,mi,s]=time.split(":").map(Number);
 return {date,time,name,dt:new Date(2000+yy,mo-1,da,h,mi,s)};
}
function parseEntryList(text,source){
 const shots=[];
 // SPIXDのAI用エンドポイントはXML。保存HTMLの読み込みにも引き続き対応する。
 const xml=new DOMParser().parseFromString(text,"application/xml");
 const xmlEntries=[...xml.querySelectorAll("entry_data")];
 if(xmlEntries.length){
  for(const entry of xmlEntries){
   const date=entry.querySelector("date")?.textContent.trim()||"";
   const time=entry.querySelector("time")?.textContent.trim()||"";
   const name=entry.querySelector("name")?.textContent.trim()||"";
   const shot=toShot(date,time,name);if(shot)shots.push(shot);
  }
 }else{
  const doc=new DOMParser().parseFromString(text,"text/html");
  for(const tr of doc.querySelectorAll("tr")){
   const td=[...tr.querySelectorAll("td")];if(td.length<5)continue;
   const shot=toShot(td[1]?.textContent.trim()||"",td[2]?.textContent.trim()||"",td[4]?.textContent.trim()||"");
   if(shot)shots.push(shot);
  }
 }
 shots.sort((a,b)=>a.dt-b.dt);
 if(!shots.length){alert("撮影ログを見つけられませんでした。");return false}
 const latestDate=shots.at(-1).date;
 render(shots.filter(x=>x.date===latestDate),source);
 return true;
}
$("file").addEventListener("change",async e=>{const f=e.target.files[0];if(f)parseEntryList(await f.text(),f.name)});
$("loadSpixd").addEventListener("click",async()=>{
 const g=$("groupId").value.trim();if(!g)return;
 const url="https://spixd.com/aipro/ai-entrylist.php?g="+encodeURIComponent(g);
 $("connection").textContent="SPIXDへ接続中…";
 try{
  const r=await fetch(url,{credentials:"include",cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const text=await r.text();
  if(parseEntryList(text,"SPIXD / "+g)){
   $("connection").textContent="接続成功：SPIXDからENTRY LISTを取得しました。";
  }else{
   $("connection").textContent="取得はできましたが、ENTRY LISTとして解析できませんでした。認証画面が返っている可能性があります。";
  }
 }catch(err){
  $("connection").textContent="接続失敗："+err.message+"（CORSまたは認証制限の可能性があります）";
 }
});
function countSince(shots,end,min){const start=end-min*60000;return shots.filter(x=>x.dt>start&&x.dt<=end).length}
function render(shots,file){
 if(!shots.length){alert("撮影ログを見つけられませんでした。");return}
 const first=shots[0],last=shots.at(-1),m5=countSince(shots,last.dt,5),m10=countSince(shots,last.dt,10),m30=countSince(shots,last.dt,30);
 const diffs=shots.slice(1).map((x,i)=>(x.dt-shots[i].dt)/1000).filter(x=>x>=0);
 const avg=diffs.length?Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length):0;
 const elapsedHours=Math.max((last.dt-first.dt)/3600000,1/60);
 const dayPace=Math.round(shots.length/elapsedHours);
 $("liveDate").textContent=`${first.date} LIVE`;$("total").textContent=shots.length;$("m5").textContent=m5;$("m10").textContent=m10;$("m30").textContent=m30;$("pace").textContent=m30*2;$("currentPace").textContent=m5*12;$("dayPace").textContent=dayPace;$("interval").textContent=avg;$("first").textContent=first.time;$("last").textContent=last.time;
 $("meta").innerHTML=`${file}<br>${first.date} / ${shots.length}件（TESTを除外）<br>※「現在」は保存されたログの最終撮影時刻 ${last.time} として計算`;
 const buckets=new Map();
 for(const x of shots){const d=new Date(x.dt);d.setMinutes(Math.floor(d.getMinutes()/5)*5,0,0);const k=d.getTime();buckets.set(k,(buckets.get(k)||0)+1)}
 const start=new Date(first.dt);start.setMinutes(Math.floor(start.getMinutes()/5)*5,0,0);
 const end=new Date(last.dt);end.setMinutes(Math.floor(end.getMinutes()/5)*5,0,0);
 const vals=[];for(let t=start.getTime();t<=end.getTime();t+=300000)vals.push([t,buckets.get(t)||0]);
 const bucketCounts=vals.map(x=>x[1]);
 const peakCount=Math.max(...bucketCounts,0),peakPace=peakCount*12;
 $("peakPace").textContent=peakPace;
 // 暫定定義: 本日平均の1.25倍以上を「高負荷」とし、最新区間から連続した時間を表示
 const highThreshold=dayPace*1.25;
 let highBuckets=0;
 for(let i=vals.length-1;i>=0;i--){if(vals[i][1]*12>=highThreshold&&vals[i][1]>0)highBuckets++;else break}
 const highMinutes=highBuckets*5;$("highDuration").textContent=highMinutes;
 const currentPace=m5*12,ratio=dayPace?currentPace/dayPace:0;
 let status="通常",detail=`現在 ${currentPace}組/時。本日平均 ${dayPace}組/時です。`;
 if(m5===0){status="撮影が止まっています";detail="直近5分に新しい撮影記録がありません。";}
 else if(ratio>=1.5&&highMinutes<=10){status="突発ピーク";detail=`現在 ${currentPace}組/時。本日平均の約${ratio.toFixed(1)}倍のペースです。`;}
 else if(highMinutes>=15){status="高負荷継続";detail=`平均を上回る高い撮影ペースが約${highMinutes}分続いています。現在 ${currentPace}組/時です。`;}
 else if(ratio<=0.6){status="ペース低下";detail=`現在 ${currentPace}組/時。本日平均 ${dayPace}組/時を下回っています。`;}
 $("statusText").textContent=status;$("statusDetail").textContent=detail;
 const rawMax=Math.max(...vals.map(x=>x[1]),1);
 const step=Math.max(1,Math.ceil(rawMax/4)),max=step*4,chart=$("chart"),yaxis=$("yaxis");chart.innerHTML="";yaxis.innerHTML="";
 for(let v=0;v<=max;v+=step){const tick=document.createElement("span");tick.className="ytick";tick.textContent=v;tick.style.bottom=(v/max*100)+"%";yaxis.appendChild(tick)}
 vals.forEach(([t,n])=>{const b=document.createElement("div");b.className="bar";b.style.height=Math.max(2,n/max*100)+"%";b.dataset.tip=new Date(t).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+" "+n+"組 / 時速換算 "+(n*12)+"組";chart.appendChild(b)});
 $("empty").hidden=true;$("dash").hidden=false;
}
</script></body></html>
